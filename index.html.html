<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superwog Galactic Defense – Season Passes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0e17;
      color: #e0e6f0;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #0f172a, #1e293b);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }

    header p {
      color: #94a3b8;
      margin-top: 0.3rem;
      font-size: 0.95rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      color: #f1f5f9;
      border-left: 4px solid #38bdf8;
      padding-left: 0.8rem;
    }

    .pass-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border-top: 4px solid #a855f7;
    }

    .pass-image {
      width: 100%;
      display: block;
    }

    .pass-content {
      padding: 1.75rem;
    }

    .status {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #4c1d95;
      color: #e9d5ff;
    }

    .pass-card h3 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }

    .pass-card p {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 1.25rem;
    }

    .highlight {
      color: #c084fc;
      font-weight: 600;
    }

    .pass-meta {
      font-size: 0.95rem;
      color: #64748b;
      border-top: 1px solid #1e293b;
      padding-top: 1rem;
      margin-top: 0.5rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #475569;
      font-size: 0.85rem;
      border-top: 1px solid #1e293b;
      margin-top: 3rem;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.4rem;
      }
      .pass-card h3 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Superwog Galactic Defense</h1>
    <p>Season Passes</p>
  </header>

  <div class="container">

    <h2 class="section-title">Current Season Pass</h2>

    <div class="pass-card">
      <img 
        src="https://i.postimg.cc/9fFThPTW/New-Project-(2)-(2).png" 
        alt="Infinity Vaslem August Season" 
        class="pass-image"
      >

      <div class="pass-content">
        <span class="status">Active</span>
        <h3>Infinity Vaslem – August 2026 Season</h3>
        <p>
          The current season pass is live.  
          This season includes the exclusive <span class="highlight">Mike Johnson Exotic unit</span>.
        </p>
        <div class="pass-meta">
          Ends on <strong>September 1st 2026</strong>
        </div>
      </div>
    </div>

  </div>

  <footer>
    Superwog Galactic Defense • Season Passes
  </footer>

</body>
</html>
